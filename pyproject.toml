[project]
name = "ps12-energy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.163.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
