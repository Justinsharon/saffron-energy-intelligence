# Netlify: set "Base directory" to web in the site settings (this file lives there).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
  Cache-Control = "public, max-age=3600"

# Forecast / plan API on Google Cloud Run (api/main.py; see CLAUDE.md "API"). Keep this above any SPA catch-all rule.
[[redirects]]
  from = "/api/*"
  to = "https://saffron-api-579804303171.asia-south1.run.app/:splat"
  status = 200
  force = true

# Plant Room (SIMULATION screen, web/plant.html) on this site at /plant. A second site built from this repo with SAFFRON_SITE=plant serves it
# at / instead (web/scripts/site-role.mjs); both use the same /api proxy, the same functions and the same gist (plant_state.json).
[[redirects]]
  from = "/plant"
  to = "/plant.html"
  status = 200
